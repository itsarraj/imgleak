[package]
name = "imgleak"
version = "0.1.0"
edition = "2021"
description = "Scans a saved Docker image's real layer tarballs for secrets baked into any layer, even ones a later layer only hides"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/imgleak"
readme = "README.md"
keywords = ["docker", "security", "secrets", "container", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "imgleak"
path = "src/lib.rs"

[[bin]]
name = "imgleak"
path = "src/main.rs"

[dependencies]
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
